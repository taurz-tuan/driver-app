<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>Shipper Route Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* Layout: one portrait phone frame centred on a neutral stage; 4 screens (list, route, stop detail, completion) switch inside it. */
    :root {
      --brand: #EE4D2D;
      --brand-ink: #fff;
      --brand-text: #C9381A;
      --brand-soft: #FFEDE8;
      --brand-line: #F6B4A5;
      --stage: #ECE6E2;
      --bezel: #19171A;
      --app: #F6F3F1;
      --surface: #FFFFFF;
      --surface2: #F4F0EE;
      --fg: #2A2321;
      --muted: #7D736E;
      --line: #ECE6E3;
      --ok: #168A55;
      --ok-soft: #E1F5EA;
      --warn: #B7740A;
      --warn-soft: #FFF1D6;
      --bad: #D03434;
      --bad-soft: #FDE6E6;
      --map-land: #F0EBE7;
      --map-road: #FFFFFF;
      --map-water: #CFE3F1;
      --map-park: #D6E7D2;
      --map-label: #9A8F89;
      --sh: 0 6px 20px -8px rgba(60, 30, 20, .18);
      --sh-up: 0 -10px 28px -12px rgba(60, 30, 20, .22);
      --ph1: #C6B6AC;
      --ph2: #8A776C;
      --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --brand: #F2583A;
        --brand-text: #FF8E74;
        --brand-soft: #3A211B;
        --brand-line: #7A3426;
        --stage: #0E0C0B;
        --bezel: #2A2729;
        --app: #151211;
        --surface: #201C1A;
        --surface2: #2B2623;
        --fg: #F5EFEC;
        --muted: #A59B95;
        --line: #352F2C;
        --ok: #43C98B;
        --ok-soft: #14352A;
        --warn: #F2B13D;
        --warn-soft: #3B2F12;
        --bad: #FF7070;
        --bad-soft: #3E1B1B;
        --map-land: #1D1917;
        --map-road: #2E2825;
        --map-water: #1D3040;
        --map-park: #1F3321;
        --map-label: #7C726C;
        --sh: 0 6px 20px -8px rgba(0, 0, 0, .6);
        --sh-up: 0 -10px 28px -12px rgba(0, 0, 0, .7);
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --brand: #F2583A;
      --brand-text: #FF8E74;
      --brand-soft: #3A211B;
      --brand-line: #7A3426;
      --stage: #0E0C0B;
      --bezel: #2A2729;
      --app: #151211;
      --surface: #201C1A;
      --surface2: #2B2623;
      --fg: #F5EFEC;
      --muted: #A59B95;
      --line: #352F2C;
      --ok: #43C98B;
      --ok-soft: #14352A;
      --warn: #F2B13D;
      --warn-soft: #3B2F12;
      --bad: #FF7070;
      --bad-soft: #3E1B1B;
      --map-land: #1D1917;
      --map-road: #2E2825;
      --map-water: #1D3040;
      --map-park: #1F3321;
      --map-label: #7C726C;
      --sh: 0 6px 20px -8px rgba(0, 0, 0, .6);
      --sh-up: 0 -10px 28px -12px rgba(0, 0, 0, .7);
      color-scheme: dark
    }

    body {
      background: var(--stage);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased
    }

    * {
      box-sizing: border-box
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      padding: 0
    }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-block: 24px;
      padding-inline: 16px
    }

    .phone {
      position: relative;
      width: 390px;
      height: 800px;
      max-width: 100%;
      border-radius: 56px;
      background: var(--bezel);
      padding: 10px;
      box-shadow: 0 30px 60px -24px rgba(40, 20, 10, .45)
    }

    .glass {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 46px;
      overflow: hidden;
      background: var(--app)
    }

    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 26px;
      border-radius: 99px;
      background: #000;
      z-index: 30
    }

    .status {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 28px 0;
      font-size: 13px;
      font-weight: 700;
      z-index: 25;
      pointer-events: none
    }

    .status .sig {
      display: flex;
      gap: 5px;
      align-items: center
    }

    .bat {
      width: 22px;
      height: 11px;
      border-radius: 3.5px;
      border: 1.5px solid currentColor;
      position: relative;
      opacity: .9
    }

    .bat::after {
      content: '';
      position: absolute;
      inset: 1.5px;
      right: 5px;
      background: currentColor;
      border-radius: 1.5px
    }

    .mapview .status {
      color: var(--fg)
    }

    .scr {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-top: 46px;
      background: var(--app)
    }

    .scr.enter {
      animation: in .28s ease-out
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateX(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes pulse {
      0% {
        opacity: .55;
        transform: scale(.7)
      }

      100% {
        opacity: 0;
        transform: scale(2.1)
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(24px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes rec {
      50% {
        box-shadow: 0 0 0 8px rgba(238, 77, 45, .18)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none
    }

    .scroll::-webkit-scrollbar {
      display: none
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 16px 12px
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      flex: none
    }

    .hello {
      flex: 1;
      min-width: 0
    }

    .hello small {
      display: block;
      font-size: 12px;
      color: var(--muted)
    }

    .hello strong {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block
    }

    .cbtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--sh);
      display: grid;
      place-items: center;
      flex: none;
      position: relative
    }

    .cbtn.sm {
      width: 36px;
      height: 36px
    }

    .cbtn .dot {
      position: absolute;
      top: 9px;
      right: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand);
      border: 2px solid var(--surface)
    }

    .online {
      height: 40px;
      padding: 0 12px 0 10px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      flex: none
    }

    .online i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok)
    }

    .online.off i {
      background: var(--muted)
    }

    .xp {
      margin: 0 16px 12px;
      background: var(--surface);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--sh)
    }

    .lvl {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--brand-soft);
      color: var(--brand-text);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      flex: none
    }

    .xp .meta {
      flex: 1;
      min-width: 0
    }

    .xp .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .xp .row b {
      color: var(--fg);
      font-weight: 700;
      font-size: 13px
    }

    .bar {
      height: 8px;
      border-radius: 99px;
      background: var(--surface2);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--brand);
      transition: width .6s ease
    }

    .search {
      margin: 0 16px 14px;
      height: 44px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      color: var(--muted)
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: none;
      font: inherit;
      font-size: 14px;
      color: var(--fg);
      outline: 0
    }

    .h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin: 0;
      text-wrap: balance
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin: 2px 0 0
    }

    .sec {
      padding: 0 16px 10px
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 12px;
      scrollbar-width: none
    }

    .chips::-webkit-scrollbar {
      display: none
    }

    .chip {
      flex: none;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--sh);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted)
    }

    .chip.on {
      background: var(--brand);
      color: #fff
    }

    .chip.line {
      box-shadow: none;
      border: 1.5px solid var(--line);
      background: var(--surface)
    }

    .chip.line.on {
      background: var(--brand-soft);
      border-color: var(--brand-line);
      color: var(--brand-text)
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 16px 200px
    }

    .ocard {
      background: var(--surface);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      gap: 12px;
      box-shadow: var(--sh);
      cursor: pointer;
      text-align: left
    }

    .ocard.done {
      opacity: .6
    }

    .seq {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand-text);
      display: grid;
      place-items: center;
      font-weight: 800;
      flex: none
    }

    .seq.n {
      background: var(--brand);
      color: #fff
    }

    .seq.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .ocard .body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .ocard .l1 {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center
    }

    .ocard .name {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .addr {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35
    }

    .addr svg {
      margin-top: 1px
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      font-size: 12px;
      color: var(--muted)
    }

    .meta-row span {
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex: none
    }

    .p-brand {
      background: var(--brand-soft);
      color: var(--brand-text)
    }

    .p-ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .p-warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .p-bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .p-mute {
      background: var(--surface2);
      color: var(--muted)
    }

    .dock {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 88px;
      background: var(--surface);
      border-radius: 26px;
      padding: 12px;
      box-shadow: 0 14px 34px -10px rgba(60, 30, 20, .35);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 6
    }

    .dock p {
      margin: 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted)
    }

    .btn {
      height: 48px;
      border-radius: 999px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap
    }

    .btn.primary {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 10px 22px -8px rgba(238, 77, 45, .6)
    }

    .btn.soft {
      background: var(--brand-soft);
      color: var(--brand-text)
    }

    .btn.ghost {
      background: var(--surface2);
      color: var(--fg)
    }

    .btn.block {
      width: 100%
    }

    .btn[disabled] {
      opacity: .45;
      box-shadow: none;
      cursor: not-allowed
    }

    .nav {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 64px;
      border-radius: 26px;
      background: var(--surface);
      box-shadow: 0 12px 30px -10px rgba(60, 30, 20, .4);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px;
      gap: 4px;
      z-index: 7
    }

    .nav button {
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted)
    }

    .nav button.on {
      background: var(--brand-soft);
      color: var(--brand-text)
    }

    .mapbox {
      position: relative;
      height: 322px;
      flex: none;
      overflow: hidden;
      margin-top: -46px;
      padding-top: 0
    }

    .mapbox>svg.mapsvg {
      display: block;
      width: 100%;
      height: 100%
    }

    .maptop {
      position: absolute;
      top: 52px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 4
    }

    .maptitle {
      flex: 1;
      min-width: 0;
      height: 36px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden
    }

    .mapchip {
      position: absolute;
      left: 12px;
      bottom: 34px;
      height: 32px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 700;
      z-index: 4
    }

    .mapchip.r {
      left: auto;
      right: 12px;
      background: var(--brand);
      color: #fff
    }

    .maphint {
      position: absolute;
      left: 12px;
      bottom: 34px;
      max-width: 70%;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      box-shadow: var(--sh);
      z-index: 4
    }

    .sheet {
      flex: 1;
      min-height: 0;
      margin-top: -24px;
      background: var(--app);
      border-radius: 28px 28px 0 0;
      position: relative;
      box-shadow: var(--sh-up);
      overflow-y: auto;
      padding: 10px 16px 110px;
      scrollbar-width: none;
      z-index: 5
    }

    .sheet::-webkit-scrollbar {
      display: none
    }

    .grab {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin: 0 auto 14px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0
    }

    .stat {
      background: var(--surface);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: var(--sh);
      min-width: 0
    }

    .stat b {
      display: block;
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .stat span {
      font-size: 11px;
      color: var(--muted)
    }

    .banner {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--ok-soft);
      color: var(--ok);
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 14px
    }

    .h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .steps {
      display: flex;
      overflow-x: auto;
      margin: 0 -16px 14px;
      padding: 4px 16px 8px;
      scrollbar-width: none
    }

    .steps::-webkit-scrollbar {
      display: none
    }

    .st {
      flex: none;
      width: 74px;
      text-align: center;
      position: relative;
      font-size: 11px;
      color: var(--muted)
    }

    .st::before {
      content: '';
      position: absolute;
      top: 14px;
      left: -50%;
      width: 100%;
      height: 3px;
      background: var(--line)
    }

    .st:first-child::before {
      display: none
    }

    .st i {
      position: relative;
      z-index: 1;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      margin: 0 auto 6px;
      font-style: normal;
      font-weight: 800;
      font-size: 12px;
      color: var(--muted)
    }

    .st.cur i {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff
    }

    .st.cur::before,
    .st.done::before {
      background: var(--brand)
    }

    .st.done i {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff
    }

    .st.cur {
      color: var(--fg);
      font-weight: 700
    }

    .st b {
      display: block;
      font-weight: 600;
      color: var(--fg);
      font-variant-numeric: tabular-nums
    }

    .srow {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--surface);
      border-radius: 18px;
      padding: 10px 12px;
      box-shadow: var(--sh);
      cursor: pointer;
      margin-bottom: 8px
    }

    .srow .t {
      flex: 1;
      min-width: 0
    }

    .srow .t b {
      display: block;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    }

    }

    }

    }

    }

      }
    }

    }

      transform-origin: center;
      animation: hz 1.3s ease-out infinite
    }

      }

        transform: scale(2.3)
      }

          }
          case 'conf': { if (v === 'send') st.conf[id] = 'pending'; else if (v === 'yes') st.conf[id] = 'confirmed'; else if (v === 'none') st.conf[id] = 'noreply'; else st.conf[id] = 'none'; render.detail(); renderPanel(); break; }
          case 'force': st.force[st.active] = true; toast('Stop kept in today\'s route'); render.detail(); renderPanel(); break;
          case 'move': { const id2 = st.active; st.moved[id2] = true; st.alert = { text: esc(byId[id2].name) + ' moved to tomorrow morning. The recipient will get a message to confirm the new time.', ok: true }; addXP(5, 'Followed a suggestion'); go('route'); break; }
          case 'fail': overlay(`<h2 class="h1" style="font-size:18px">Delivery failed</h2><p class="sub">Pick a reason so the hub can handle this order.</p><div class="chipset">${['Recipient could not come out', 'Outside office hours', 'Guard did not allow entry', 'No one to receive', 'Wrong address'].map(r => `<button class="chip line" data-act="fail-reason" data-v="${r}">${r}</button>`).join('')}</div><div class="field-row"><button class="btn ghost" style="flex:1" data-act="close">Cancel</button><button class="btn primary" style="flex:2" data-act="fail-send" id="failBtn" disabled>Confirm</button></div>`); break;
          case 'fail-reason': $$('#overlay .chip').forEach(c => c.classList.toggle('on', c === t)); $('#failBtn').disabled = false; break;
          case 'fail-send': {
            const sid = st.active, s = byId[sid]; st.failed[sid] = true;
            const opts = ['morning', 'afternoon', 'evening'].map(sl => ({ sl, p: lk(s.type, sl, 'wd').p })).sort((x, y) => y.p - x.p); const ev = lk(s.type, 'evening', 'wd').p;
            st.clock = Math.max(st.clock, actualFor(sid).eta) + s.svc; st.pos = sid;
            overlay(`<div class="okc" style="margin:0 auto 10px;background:var(--warn)">${ic('clock', 30)}</div><h2 class="h1" style="font-size:19px">Failed delivery logged</h2><p class="sub">Suggested retry: <b>${SLOT[opts[0].sl].toLowerCase()} of the next working day</b> (${pct(opts[0].p)}) instead of the evening (${pct(ev)}). In the data, evening re-deliveries succeed only 53.9% of the time vs 80.7% outside the evening.</p><button class="btn primary block" style="margin-top:14px" data-act="after">Back to orders</button>`, 'center'); break;
          }
          case 'close': closeOverlay(); break;
          case 'deliver': resetDraft(); go('done'); break;
          case 'cod': d.cod = !d.cod; t.classList.toggle('on', d.cod); t.setAttribute('aria-checked', d.cod); refreshDone(); break;
          case 'late-reason': d.reason = v; $$('[data-act=late-reason]').forEach(c => c.classList.toggle('on', c === t)); refreshDone(); break;
          case 'tag': { const ta = $('#noteText'); ta.value = ((ta.value ? ta.value + '. ' : '') + v).slice(0, 140); $('#ncnt').textContent = ta.value.length + '/140'; break; }
          case 'mic': startVoice(); break;
          case 'dstar': d.star = !d.star; t.classList.toggle('on', d.star); t.setAttribute('aria-pressed', d.star); break;
          case 'addnote': {
            const ta = $('#noteText'), txt = ta.value.trim(), arr = st.notes[st.active];
            if (!txt && !d.photo) { toast('Type a note or add a photo first'); break; }
            if (arr.length >= 8) {
              const low = arr.slice().sort((x, y) => x.n - y.n)[0];
              overlay(`<h2 class="h1" style="font-size:18px">This address already has 8 notes</h2><p class="sub">To add a new one, replace an old note. Suggested: the least-reported note.</p><div id="rlist" style="margin:10px 0">${arr.map(n => `<button class="srow" style="width:100%;text-align:left;${n.id === low.id ? 'box-shadow:inset 0 0 0 2px var(--brand)' : ''}" data-act="rep-pick" data-id="${n.id}"><div class="t"><b>${esc(n.t)}</b><span>Logged ${n.n} times</span></div></button>`).join('')}</div><div class="chipset">${DELR.map(r => `<button class="chip line" data-act="rep-reason" data-v="${r}">${r}</button>`).join('')}</div><div class="field-row"><button class="btn ghost" style="flex:1" data-act="close">Cancel</button><button class="btn primary" style="flex:2" data-act="rep-ok" id="repBtn" disabled>Replace note</button></div>`);
              st.draft.rep = { id: low.id, reason: '' }; break;
            }
            pushNote(txt); break;
          }
          case 'rep-pick': st.draft.rep.id = id; $$('#rlist .srow').forEach(r => r.style.boxShadow = r.dataset.id === id ? 'inset 0 0 0 2px var(--brand)' : ''); break;
          case 'rep-reason': st.draft.rep.reason = v; $$('#overlay .chip').forEach(c => c.classList.toggle('on', c === t)); $('#repBtn').disabled = false; break;
          case 'rep-ok': { const arr = st.notes[st.active], i = arr.findIndex(n => n.id === st.draft.rep.id); if (i > -1) arr.splice(i, 1); closeOverlay(); addXP(8, 'Replaced a note, with reason'); pushNote($('#noteText').value.trim()); break; }
          case 'delpick': d.delId = id; d.delReason = ''; $('#delForm').hidden = false; $$('#dlist .drow').forEach(r => r.style.opacity = r.querySelector('[data-id="' + id + '"]') ? 1 : .4); $$('[data-act=del-reason]').forEach(c => c.classList.remove('on')); $('#delForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); break;
          case 'del-reason': d.delReason = v; $$('[data-act=del-reason]').forEach(c => c.classList.toggle('on', c === t)); break;
          case 'delcancel': d.delId = null; $('#delForm').hidden = true; refreshDone(); break;
          case 'delsend': {
            if (!d.delReason) { toast('Please pick a reason'); break; }
            const arr = st.notes[st.active], i = arr.findIndex(n => n.id === d.delId); if (i > -1) arr.splice(i, 1); d.delId = null; $('#delForm').hidden = true; $('#delText').value = ''; addXP(8, 'Requested a note removal'); refreshDone(); break;
          }
          case 'finish': {
            const sid = st.active, s = byId[sid]; const pl = makePlan(); const before = pl.order.join() + '|' + pl.deferred.join();
            const { act } = actualFor(sid);
            if (st.late12) addXP(5, 'Explained the delay'); else addXP(5, 'On-time delivery'); addXP(10, 'Delivery completed');
            st.done[sid] = true; st.clock = act + s.svc; st.pos = sid; st.alert = null; st.incident = null;
            replanAfter(before, 'Delivered ' + esc(s.name) + '.');
            taskHit('C');
            const tot = st.earned.reduce((x, y) => x + y.xp, 0), lv = st.leveled; st.leveled = false;
            overlay(`<div class="okc" style="margin:0 auto 10px">${ic('check', 32)}</div><h2 class="h1" style="font-size:20px">${lv ? 'Level up! Level ' + st.lvl : 'Order completed'}</h2>
       <p class="sub">${lv ? 'You are now a ' + lvName(st.lvl) : 'Thanks for updating info for the next rider'}</p>
       <div class="card" style="margin:14px 0;text-align:left"><div class="rowline" style="margin-bottom:8px"><b>Level ${st.lvl} · ${lvName(st.lvl)}</b><span class="pill p-brand">+${tot} XP</span></div><div class="bar"><i style="width:${st.xp / 5}%"></i></div><p class="sub" style="margin-top:6px">${st.xp}/500 XP to level ${st.lvl + 1}</p></div>
       <button class="btn primary block" data-act="after">${remaining().length ? 'Back to orders' : 'Finish shift'}</button>`, 'center'); break;
          }
          case 'after': closeOverlay(); st.earned = []; go('orders'); break;
          case 'jump': { closeOverlay(); if (v !== 'orders') st.optimized = true; if (v === 'detail' || v === 'done') { const vv = view(), inf = infoMap(vv), ids = vv.order.concat(vv.deferred || []); const red = ids.find(i => rk(inf[i].p) === 'red'); st.active = red || ids[0] || 's1'; if (v === 'done') { st.earned = []; resetDraft(); } } go(v); break; }
          case 'ptab': st.tab = v; renderPanel(); break;
          case 'scen': setScenario(t.dataset.k, v); break;
          case 'late12': st.late12 = true; if (st.screen === 'done') render.done(); renderPanel(); break;
          case 'late0': st.late12 = false; if (st.screen === 'done') render.done(); renderPanel(); break;
          case 'reset': { const keepTab = st.tab; init(); st.tab = keepTab; closeOverlay(); go('orders'); break; }
          case 'task-start': taskStart(t.dataset.k); break;
          case 'task-stop': taskEnd('quit'); break;
          case 'copycsv': {
            const hdr = 'tester,task,result,seconds,taps,mistaps,time,scenario'; const rows = T.runs.map(r => [r.tester, r.task, r.result, r.sec, r.taps, r.mis, r.at, r.scen].join(',')); const csv = [hdr].concat(rows).join('\n');
            const fb = () => { const ta = document.createElement('textarea'); ta.value = csv; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove(); };
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(csv).then(() => toast('CSV copied'), () => { fb(); toast('CSV copied'); }); } else { fb(); toast('CSV copied'); } break;
          }
          case 'clearruns': T.runs = []; saveRuns(); renderPanel(); break;
        }
      });
      function pushNote(txt) {
        const d = st.draft, arr = st.notes[st.active];
        arr.push({ id: 'u' + Date.now(), t: txt || 'Photo note', n: 1, last: 'today', eff: null, star: d.star, ok: 0, bad: 0, photo: d.photo, mine: true });
        addXP(10, 'New note'); if (d.photo) addXP(15, 'Note with photo'); if (d.voice) addXP(5, 'Voice note');
        const ta = $('#noteText'); if (ta) { ta.value = ''; $('#ncnt').textContent = '0/140'; } d.photo = null; d.voice = false; d.star = false;
        const th = $('#noteThumb'); if (th) th.style.display = 'none'; const sb = $('#starBtn'); if (sb) sb.classList.remove('on'); refreshDone();
      }
      document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); } });
      document.addEventListener('input', e => {
        if (e.target.id === 'noteText') $('#ncnt').textContent = e.target.value.length + '/140';
        if (e.target.id === 'tester') T.tester = e.target.value;
        if (e.target.id === 'q') { st.q = e.target.value; const v = view(); $('#olist').innerHTML = listHTML(v, infoMap(v)); }
      });
      document.addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if (!f) return; const url = URL.createObjectURL(f);
        if (e.target.id === 'podFile') { st.draft.pod = url; $('#podThumb').innerHTML = '<img src="' + url + '" alt="Delivery photo">'; toast('Delivery photo added'); }
        if (e.target.id === 'noteFile') { st.draft.photo = url; const t = $('#noteThumb'); t.style.display = 'grid'; t.innerHTML = '<img src="' + url + '" alt="Note photo">'; }
      });
      init(); go('orders');
    })();
  </script>
